<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1150" viewBox="0 0 1280 1150" role="img" aria-labelledby="title desc">
  <title id="title">菜单脚本安装后，复制完整 Hysteria 2 分享链接</title>
  <desc id="desc">步骤示意，对应正文第六节。菜单 1 安装，按提示设置证书、UDP 端口 26818、单端口和独立长密码。安装成功后复制完整的 hysteria2 或 hy2 分享链接。菜单 5 可以重新查看链接。本图不展示真实连接凭据。</desc>
  <defs><style>
    .sans { font-family: 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
    .mono { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; }
    .title { font-size: 40px; font-weight: 700; fill: #142d4e; }
    .body { font-size: 28px; fill: #243b53; }
    .small { font-size: 25px; fill: #42566e; }
    .code { font-size: 28px; fill: #16324f; }
    .label { font-size: 30px; font-weight: 700; fill: #142d4e; }
    .num { font-size: 28px; font-weight: 700; fill: #fff; text-anchor: middle; }
  </style></defs>
  <rect width="1280" height="1150" fill="#fff"/>
  <rect width="1280" height="14" fill="#ff9900"/>
  <text x="64" y="86" class="sans title">安装完成，把节点链接复制出来</text>
  <text x="64" y="135" class="sans small">步骤示意 · 对应正文第六节 · 不展示真实连接凭据</text>

  <circle cx="88" cy="208" r="24" fill="#ff9900"/>
  <text x="88" y="218" class="sans num">1</text>
  <text x="132" y="218" class="sans label">打开脚本菜单，输入 1 开始安装</text>
  <text x="132" y="265" class="sans body">按提示选择证书方式，再填写下面几个选项。</text>

  <rect x="64" y="302" width="1152" height="290" rx="20" fill="#f1f5fa" stroke="#d8e2ee"/>
  <text x="98" y="358" class="sans label">按正文示例填写</text>
  <text x="98" y="411" class="sans body">证书：按菜单提示选择</text>
  <text x="98" y="460" class="sans body">服务端口：26818 / UDP</text>
  <text x="98" y="509" class="sans body">端口模式：单端口，不启用端口跳跃</text>
  <text x="98" y="558" class="sans body">连接密码：自己设置的独立长密码</text>

  <circle cx="88" cy="654" r="24" fill="#ff9900"/>
  <text x="88" y="664" class="sans num">2</text>
  <text x="132" y="664" class="sans label">安装成功后，找到脚本输出的分享链接</text>
  <rect x="132" y="694" width="1084" height="125" rx="16" fill="#eaf1fa"/>
  <text x="162" y="744" class="mono code">hysteria2://…</text>
  <text x="162" y="790" class="sans body">也可能以 hy2:// 开头；这里只展示格式，不是可用节点。</text>

  <circle cx="88" cy="884" r="24" fill="#ff9900"/>
  <text x="88" y="894" class="sans num">3</text>
  <text x="132" y="894" class="sans label">复制整条链接，接下来直接导入客户端</text>
  <text x="132" y="942" class="sans body">从协议开头复制到行尾，保留完整参数。</text>
  <text x="132" y="986" class="sans small">没保存下来？菜单 5 可重看；脚本也会保存到 /root/hy/url.txt。</text>

  <rect x="64" y="1022" width="1152" height="91" rx="16" fill="#fff6e7" stroke="#f0bd70"/>
  <text x="90" y="1060" class="sans small">自签模式链接中的 insecure=1 表示跳过证书校验，</text>
  <text x="90" y="1094" class="sans small">具体含义见正文折叠说明；导入链接不会自动保证证书验证。</text>
</svg>
