<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1420" viewBox="0 0 1280 1420" role="img" aria-labelledby="title desc">
  <title id="title">v2rayN 7.25.6 导入和证书验证检查</title>
  <desc id="desc">配置示意。先从剪贴板导入链接并核对 IP、端口、密码和 SNI，再检查实际内核配置。Xray 检查 pinnedPeerCertSha256，sing-box 使用完整公有 PEM 证书和 insecure false。不要复制 server.key。</desc>
  <defs>
    <style>
      .sans { font-family: 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: 'SFMono-Regular', Menlo, Consolas, monospace; }
      .title { font-size: 40px; font-weight: 700; fill: #142d4e; }
      .body { font-size: 27px; fill: #243b53; }
      .small { font-size: 25px; fill: #42566e; }
      .code { font-size: 25px; fill: #16324f; }
      .label { font-size: 29px; font-weight: 700; fill: #142d4e; }
      .num { font-size: 27px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1280" height="1420" fill="#ffffff"/>
  <rect width="1280" height="14" fill="#ff9900"/>
  <text x="64" y="86" class="sans title">v2rayN：导入后，还要检查证书验证</text>
  <text x="64" y="135" class="sans small">配置示意 · 以 v2rayN 7.25.6 为例 · 占位值须替换</text>

  <circle cx="86" cy="199" r="23" fill="#ff9900"/>
  <text x="86" y="209" class="sans num">1</text>
  <text x="125" y="209" class="sans label">复制完整链接 → 从剪贴板导入批量 URL</text>
  <text x="125" y="255" class="sans body">链接中的 IP、密码和指纹，先换成自己的值。</text>
  <circle cx="86" cy="318" r="23" fill="#ff9900"/>
  <text x="86" y="328" class="sans num">2</text>
  <text x="125" y="328" class="sans label">核对连接信息</text>
  <rect x="125" y="355" width="1091" height="109" rx="16" fill="#f1f5fa" stroke="#d8e2ee"/>
  <text x="151" y="400" class="sans body">服务器 IP · 26818 端口 · 服务端同一密码</text>
  <text x="151" y="440" class="mono code">SNI: aws-hy2.local</text>
  <circle cx="86" cy="524" r="23" fill="#ff9900"/>
  <text x="86" y="534" class="sans num">3</text>
  <text x="125" y="534" class="sans label">确认实际内核，再检查生成的 TLS 配置</text>
  <text x="125" y="580" class="sans body">不能只看节点编辑页；不同内核的处理方式不同。</text>

  <rect x="64" y="616" width="550" height="506" rx="18" fill="#f1f5fa" stroke="#d8e2ee"/>
  <rect x="642" y="616" width="574" height="506" rx="18" fill="#f1f5fa" stroke="#d8e2ee"/>
  <text x="94" y="670" class="sans label">Xray 分支</text>
  <text x="94" y="720" class="sans body">核对指纹字段：</text>
  <text x="94" y="766" class="mono code">pinnedPeerCertSha256</text>
  <text x="94" y="818" class="sans body">它必须包含自己的</text>
  <text x="94" y="859" class="sans body">服务器证书指纹。</text>
  <rect x="94" y="903" width="490" height="172" rx="12" fill="#ffffff"/>
  <text x="116" y="947" class="sans small">正文已提供对应版本源码。</text>
  <text x="116" y="989" class="sans small">导入成功不代表证书验证</text>
  <text x="116" y="1031" class="sans small">已经配置正确。</text>

  <text x="672" y="670" class="sans label">sing-box 分支</text>
  <text x="672" y="720" class="sans body">同版本不能只靠分享链接。</text>
  <text x="672" y="771" class="sans small">通过可信 SSH 读取：</text>
  <text x="672" y="815" class="mono code">/etc/hysteria/server.crt</text>
  <text x="672" y="866" class="sans body">导入完整公有 PEM 证书。</text>
  <text x="672" y="917" class="sans small">实际 TLS 配置应包含：</text>
  <text x="672" y="963" class="mono code">certificate</text>
  <text x="672" y="1007" class="mono code">insecure: false</text>
  <text x="672" y="1051" class="mono code">server_name: aws-hy2.local</text>

  <rect x="64" y="1154" width="1152" height="145" rx="16" fill="#fff6e7" stroke="#f0bd70"/>
  <text x="90" y="1200" class="sans label">server.key 是私钥，留在服务器，不要复制。</text>
  <text x="90" y="1244" class="sans body">不知道怎样检查实际配置时，先用正文中的官方客户端。</text>
  <text x="64" y="1352" class="sans body">证书检查完成后 → 设为活动节点 → 继续做实际访问测试</text>
  <text x="64" y="1394" class="sans small">真实分享链接含凭据，不要放进公开截图。</text>
</svg>
