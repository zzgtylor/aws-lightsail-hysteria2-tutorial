<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1250" viewBox="0 0 1280 1250" role="img" aria-labelledby="title desc">
  <title id="title">复制完整链接，导入 v2rayN 或 Shadowrocket</title>
  <desc id="desc">步骤示意，对应正文第七节。使用支持 Hysteria 2 的客户端版本。在 v2rayN 中从剪贴板导入、设为活动节点并自动配置系统代理。在 iPhone 或 iPad 的 Shadowrocket 中允许粘贴并按导入提示添加节点，选中后打开连接，首次按系统提示允许 VPN 配置。图中不是客户端实拍界面。</desc>
  <defs><style>
    .sans { font-family: 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 40px; font-weight: 700; fill: #142d4e; }
    .body { font-size: 28px; fill: #243b53; }
    .small { font-size: 25px; fill: #42566e; }
    .label { font-size: 31px; font-weight: 700; fill: #142d4e; }
    .num { font-size: 27px; font-weight: 700; fill: #fff; text-anchor: middle; }
  </style></defs>
  <rect width="1280" height="1250" fill="#fff"/>
  <rect width="1280" height="14" fill="#ff9900"/>
  <text x="64" y="86" class="sans title">复制链接，直接导入客户端</text>
  <text x="64" y="135" class="sans small">步骤示意 · 对应正文第七节 · 请使用支持 Hysteria 2 的版本</text>

  <rect x="64" y="178" width="1152" height="447" rx="20" fill="#f1f5fa" stroke="#d8e2ee"/>
  <text x="98" y="235" class="sans label">电脑：v2rayN</text>
  <text x="98" y="281" class="sans small">复制的是脚本输出的完整分享链接，不是服务器 IP。</text>
  <circle cx="124" cy="333" r="22" fill="#ff9900"/>
  <text x="124" y="343" class="sans num">1</text>
  <text x="167" y="343" class="sans body">复制整条 hysteria2:// 或 hy2:// 链接。</text>
  <circle cx="124" cy="402" r="22" fill="#ff9900"/>
  <text x="124" y="412" class="sans num">2</text>
  <text x="167" y="412" class="sans body">在服务器列表按 Ctrl+V，或选择</text>
  <text x="167" y="453" class="sans body">“从剪贴板导入分享链接”一类的导入入口。</text>
  <circle cx="124" cy="509" r="22" fill="#ff9900"/>
  <text x="124" y="519" class="sans num">3</text>
  <text x="167" y="519" class="sans body">将导入的节点设为活动节点。</text>
  <circle cx="124" cy="578" r="22" fill="#ff9900"/>
  <text x="124" y="588" class="sans num">4</text>
  <text x="167" y="588" class="sans body">系统代理选择“自动配置系统代理”。</text>

  <rect x="64" y="659" width="1152" height="447" rx="20" fill="#eaf1fa" stroke="#d8e2ee"/>
  <text x="98" y="716" class="sans label">iPhone / iPad：Shadowrocket</text>
  <text x="98" y="762" class="sans small">按当前版本的粘贴与导入提示操作。</text>
  <circle cx="124" cy="814" r="22" fill="#ff9900"/>
  <text x="124" y="824" class="sans num">1</text>
  <text x="167" y="824" class="sans body">复制完整链接，再打开 Shadowrocket。</text>
  <circle cx="124" cy="883" r="22" fill="#ff9900"/>
  <text x="124" y="893" class="sans num">2</text>
  <text x="167" y="893" class="sans body">允许粘贴，按应用的导入提示添加节点。</text>
  <circle cx="124" cy="952" r="22" fill="#ff9900"/>
  <text x="124" y="962" class="sans num">3</text>
  <text x="167" y="962" class="sans body">点选刚导入的节点，再打开连接开关。</text>
  <circle cx="124" cy="1021" r="22" fill="#ff9900"/>
  <text x="124" y="1031" class="sans num">4</text>
  <text x="167" y="1031" class="sans body">首次使用时，按系统提示允许 VPN 配置。</text>
  <text x="167" y="1074" class="sans small">完成后进入下一节，用浏览器实际打开网页。</text>

  <text x="64" y="1164" class="sans body">如果不能识别链接，先检查链接是否完整、版本是否支持 Hysteria 2。</text>
  <text x="64" y="1208" class="sans small">本图为流程说明，不是客户端实拍，也不代表已经连通。</text>
</svg>
