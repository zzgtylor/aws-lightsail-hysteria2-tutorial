<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1000" viewBox="0 0 1280 1000" role="img" aria-labelledby="title desc">
  <title id="title">开启节点后，用浏览器测试实际访问</title>
  <desc id="desc">步骤示意，对应正文第八节，不是现场实测结果。开启节点并确认代理已生效后，在电脑浏览器或手机 Safari 打开常用网页。如需核对出口，通过相同代理访问公网 IP 查询页面。链接已导入或显示延迟数字均不等于实际连通。</desc>
  <defs><style>
    .sans { font-family: 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 40px; font-weight: 700; fill: #142d4e; }
    .body { font-size: 28px; fill: #243b53; }
    .small { font-size: 25px; fill: #42566e; }
    .label { font-size: 30px; font-weight: 700; fill: #142d4e; }
    .num { font-size: 28px; font-weight: 700; fill: #fff; text-anchor: middle; }
  </style></defs>
  <rect width="1280" height="1000" fill="#fff"/>
  <rect width="1280" height="14" fill="#ff9900"/>
  <text x="64" y="86" class="sans title">节点打开后，试着访问网页</text>
  <text x="64" y="135" class="sans small">步骤示意 · 对应正文第八节 · 非现场实测结果</text>

  <circle cx="88" cy="208" r="24" fill="#ff9900"/>
  <text x="88" y="218" class="sans num">1</text>
  <text x="132" y="218" class="sans label">先选中节点，再确认代理已经打开</text>
  <rect x="132" y="250" width="1084" height="142" rx="18" fill="#f1f5fa" stroke="#d8e2ee"/>
  <text x="164" y="301" class="sans body">电脑：v2rayN 设为活动节点，自动配置系统代理。</text>
  <text x="164" y="351" class="sans body">手机：Shadowrocket 选中节点，打开连接开关。</text>

  <circle cx="88" cy="458" r="24" fill="#ff9900"/>
  <text x="88" y="468" class="sans num">2</text>
  <text x="132" y="468" class="sans label">用浏览器实际打开常用网页</text>
  <text x="132" y="519" class="sans body">电脑打开浏览器，iPhone / iPad 打开 Safari。</text>
  <text x="132" y="566" class="sans body">确认网页可以加载，再试一下刷新、图片和日常访问。</text>

  <circle cx="88" cy="638" r="24" fill="#ff9900"/>
  <text x="88" y="648" class="sans num">3</text>
  <text x="132" y="648" class="sans label">需要确认走向时，再核对出口 IP</text>
  <text x="132" y="699" class="sans body">通过同一代理打开公网 IP 查询页面，</text>
  <text x="132" y="746" class="sans body">核对是否为这台 AWS 实例的预期出口地址。</text>
  <text x="132" y="793" class="sans small">使用分流规则时，先确认测试网页确实经过该节点。</text>

  <rect x="64" y="844" width="1152" height="113" rx="16" fill="#fff6e7" stroke="#f0bd70"/>
  <text x="90" y="890" class="sans label">导入成功或显示延迟，不等于已经能实际访问。</text>
  <text x="90" y="932" class="sans small">以上是操作流程示意；真实连通情况以你设备上的实际访问为准。</text>
</svg>
